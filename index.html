<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metro Messenger</title>
<style>
:root {
  --bg: #000; --panel: #1c1c1c; --text: #fff; --msg-them: #262626;
  --accent: #0078D7; --accent-hover: #1a86e0; --border: #000; --input-bg: #0f0f0f;
}
body.light {
  --bg: #f3f3f3; --panel: #fff; --text: #000; --msg-them: #e5e5e5;
  --border: #ccc; --input-bg: #fff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,sans-serif;overflow:hidden;transition:background 0.2s, color 0.2s;}
.screen{height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

#login{align-items:center;justify-content:center; animation: fadeIn 0.4s ease-out;}
.login-box{width:380px;max-width:92vw; animation: fadeInUp 0.5s ease-out;}
.login-box h1{font-size:42px;font-weight:300;margin:0;letter-spacing:-1px}
.login-box h1::after{content:"";display:block;width:46px;height:4px;background:var(--accent);margin:12px 0 26px}
input{width:100%;padding:12px 14px;margin-bottom:10px;background:var(--panel);border:none;border-bottom:2px solid var(--border);color:var(--text);font-size:15px;font-family:inherit;transition: border-color 0.2s;}
input:focus{outline:none;border-bottom-color:var(--accent)}
input::placeholder{color:#777}
button{font-family:inherit;cursor:pointer;border:none;color:#fff;transition: all 0.15s ease;}
#loginForm button{width:100%;padding:12px;background:var(--accent);font-size:15px;font-weight:600;letter-spacing:.5px}
#loginForm button:hover{background:var(--accent-hover); transform: translateY(-1px);}
.err{min-height:18px;color:#ff5a5a;font-size:13px;margin-top:8px}
.hint{margin:24px 0 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#666}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--accent);padding:12px;cursor:pointer;transition:transform .12s,filter .12s}
.tile:hover{transform:scale(1.04);filter:brightness(1.15)}
.tile b{display:block;font-size:14px}
.tile span{font-size:11px;opacity:.7}
.tile.red{background:#D13438}

header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--accent);flex:0 0 auto}
.brand{font-size:18px;font-weight:300;letter-spacing:2px;text-transform:uppercase}
.brand span{font-weight:700;margin-left:6px}
.me{display:flex;align-items:center;gap:12px;font-size:14px}
#logout,#themeBtn,#clearBtn{background:rgba(255,255,255,.2);color:#fff;padding:7px 14px;font-size:13px}
#themeBtn,#clearBtn{padding:7px 10px;font-size:16px;margin-right:8px;}
#logout:hover{background:rgba(255,255,255,.35)}
#clearBtn:hover{background:#D13438;}
.body{flex:1;display:flex;min-height:0}
aside{width:260px;flex:0 0 260px;background:var(--panel);overflow-y:auto;border-right:1px solid var(--border);transition:background 0.2s;}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);transition:background 0.2s;}
.chat-head{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--border);font-weight:600;font-size:15px;flex:0 0 auto;display:flex;align-items:center;gap:10px;}
.status-dot{width:10px;height:10px;border-radius:50%;background:#555;transition: background 0.3s;}
.status-dot.online{background:#2ecc71; animation: pulse 2s infinite;}

.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.messages::-webkit-scrollbar,aside::-webkit-scrollbar{width:8px}
.messages::-webkit-scrollbar-thumb,aside::-webkit-scrollbar-thumb{background:#333}
.empty{margin:auto;color:#555;font-size:14px;}
.msg{max-width:72%;padding:9px 13px;font-size:14px;line-height:1.45;word-wrap:break-word;border-radius:2px;position:relative; animation: fadeInUp 0.2s ease-out forwards; cursor: pointer;}
.msg:hover{filter: brightness(1.1);}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;}
.msg.them{align-self:flex-start;background:var(--msg-them);color:var(--text);}
.msg img.full-img{max-width:100%;border-radius:4px;display:block;margin-bottom:4px;cursor:zoom-in;max-height:300px;object-fit:cover;}
.msg time{display:block;font-size:10px;opacity:.65;margin-top:3px;text-align:right;}

.reply-block{background: rgba(0,0,0,0.2); border-left: 3px solid #ccc; padding: 4px 8px; margin-bottom: 6px; border-radius: 2px; font-size: 12px; opacity: 0.85; display: flex; flex-direction: column; gap: 2px;}
.msg.me .reply-block { background: rgba(0,0,0,0.15); border-left-color: rgba(255,255,255,0.7); }
.reply-block b { color: var(--accent); }
.msg.me .reply-block b { color: #fff; }
.reply-block span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.msg .check{font-size:12px;margin-left:6px;vertical-align:middle;opacity:0.7;}
.msg .check.read{color:#fff;}
.msg.them .check.read{color:#0078D7;}

.composer-container{display:flex; flex-direction:column; background:var(--panel); border-top:1px solid var(--border);}
.composer-top-bar{display:flex; gap:10px; padding: 10px 12px 0 12px;}
.composer-top-bar .preview-box{position:relative; display:inline-block;}
.composer-top-bar .preview-box img{height: 60px; border-radius: 4px; display: block;}
.composer-top-bar .close-btn{position:absolute; top:-5px; right:-5px; background:#D13438; color:#fff; border-radius:50%; width:20px; height:20px; font-size:12px; display:flex; align-items:center; justify-content:center; padding:0;}
.reply-bar{background: #2a2a2a; padding: 8px 12px; display:flex; justify-content:space-between; align-items:center; margin: 0 12px 8px 12px; border-radius:4px; border-left: 3px solid var(--accent);}
body.light .reply-bar { background: #e5e5e5; }
.reply-bar .reply-text{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.reply-bar button{background:transparent; color:#aaa; font-size:18px; padding:0 5px;}

.composer{display:flex;gap:8px;padding:12px;flex:0 0 auto;align-items:center;}
.composer input[type="text"]{margin:0;flex:1;background:var(--input-bg);border:1px solid var(--border);}
.composer button{width:48px;height:44px;background:var(--accent);color:#fff;font-size:16px;display:grid;place-items:center;}
.composer #imgBtn{background:var(--panel);border:1px solid var(--border);color:var(--text);}

.contact{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;border-bottom:1px solid var(--border);transition: background 0.15s;}
.contact:hover{background:rgba(128,128,128,0.1)}
.contact.active{background:var(--accent);color:#fff;}
.avatar{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;font-weight:700;font-size:17px;background:#D13438;color:#fff;}
.cinfo{flex:1;min-width:0}
.cname{font-size:14px;font-weight:600;}
.cprev{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:#D13438;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;}

#typingIndicator{display:none;padding:6px 18px;font-size:12px;color:#aaa;background:var(--panel);border-top:1px solid var(--border);font-style:italic;}

#lightbox { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease-out; backdrop-filter: blur(8px);}
#lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); animation: fadeInUp 0.3s ease-out; pointer-events: none; }
#lightboxClose { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; background: none; border: none; opacity: 0.6; }
#lightboxClose:hover { opacity: 1; }

@media(max-width:640px){
  .body{flex-direction:column}
  aside{width:100%;flex:0 0 auto;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}
  .contact{min-width:190px;border-right:1px solid var(--border);border-bottom:none}
  .messages{padding:12px}
  .msg{max-width:85%}
}
</style>
<!-- Подключаем socket.io с нашего же сервера -->
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="login" class="screen">
  <div class="login-box">
    <h1>Мессенджер</h1>
    <form id="loginForm">
      <input id="user" placeholder="Логин" autocomplete="username" spellcheck="false">
      <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
      <button type="submit">Войти</button>
      <div class="err" id="err"></div>
    </form>
    <div class="hint">Быстрый вход</div>
    <div class="tiles">
      <div class="tile" data-u="LitiyI0N" data-p="MSCONFIG26"><b>LitiyI0N</b><span>автозаполнить</span></div>
      <div class="tile red" data-u="Usman24" data-p="AnapaZOV2022"><b>Usman24</b><span>автозаполнить</span></div>
    </div>
  </div>
</div>

<div id="app" class="screen hidden">
  <header>
    <div class="brand">Metro<span>Messenger</span></div>
    <div class="me">
      <button id="themeBtn" title="Сменить тему">🌓</button>
      <button id="clearBtn" title="Очистить историю">🔥</button>
      <span id="meName"></span>
      <button id="logout">Выйти</button>
    </div>
  </header>
  <div class="body">
    <aside id="contacts"></aside>
    <main>
      <div class="chat-head">
        <span id="peerStatus" class="status-dot"></span>
        <span id="chatHead">Выбери собеседника</span>
      </div>
      <div class="messages" id="messages"></div>
      <div id="typingIndicator">печатает...</div>
      
      <div class="composer-container">
        <div id="attachBar" class="composer-top-bar hidden">
          <div class="preview-box">
            <img id="attachPreview" src="">
            <button type="button" id="cancelAttach" class="close-btn">×</button>
          </div>
        </div>
        <div id="replyBar" class="reply-bar hidden">
          <div class="reply-text">Ответ: <b id="replyName"></b> — <span id="replyPreview"></span></div>
          <button type="button" id="cancelReply" title="Отменить ответ">×</button>
        </div>
        <form class="composer" id="composer">
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          <button type="button" id="imgBtn" title="Прикрепить картинку">🖼️</button>
          <input id="text" type="text" placeholder="Написать сообщение..." autocomplete="off" maxlength="4000">
          <button type="submit">➤</button>
        </form>
      </div>
    </main>
  </div>
</div>

<div id="lightbox" class="hidden">
  <button id="lightboxClose">×</button>
  <img id="lightboxImg" src="">
</div>

<script>
const $ = id => document.getElementById(id);
const loginEl = $('login'), appEl = $('app');
const contactsEl = $('contacts'), messagesEl = $('messages');
const chatHeadEl = $('chatHead'), textEl = $('text');

let me = null;
let peers = [];
let current = null;
let lastClearTime = 0;
const store = {};   
const unread = {};   
let replyContext = null;
let attachImage = null;
let socket = null;

// Тема
if (localStorage.getItem('mm_theme') === 'light') document.body.classList.add('light');
$('themeBtn').onclick = () => {
  document.body.classList.toggle('light');
  localStorage.setItem('mm_theme', document.body.classList.contains('light') ? 'light' : 'dark');
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ts => new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

function playPing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

/* ---------- ЛОГИН И СОКЕТЫ ---------- */
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const login = $('user').value.trim(), pass = $('pass').value;
  $('err').textContent = '';
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();

  socket = io();

  socket.emit('login', { login, pass }, (res) => {
    if (!res.ok) { $('err').textContent = res.error; return; }
    
    me = res.user;
    peers = res.peers;
    res.messages.forEach(m => ingest(m, true));
    
    loginEl.classList.add('hidden'); 
    appEl.classList.remove('hidden');
    $('meName').textContent = me.login;
    
    renderContacts();
    const firstPeer = peers.find(p => p.id !== me.id);
    if (firstPeer) openChat(firstPeer.id);
  });

  // Обработчики сокета
  socket.on('new_message', (m) => {
    const added = ingest(m, false);
    if (added) {
      renderContacts();
      if (current) renderMessages();
    }
  });

  socket.on('peer_typing', () => {
    if (!current) return;
    const tEl = $('typingIndicator');
    tEl.textContent = peerById(current).login + ' печатает...';
    tEl.style.display = 'block';
    clearTimeout(window.typingTimeout);
    window.typingTimeout = setTimeout(() => { tEl.style.display = 'none'; }, 3000);
  });

  socket.on('status', (data) => {
    $('peerStatus').className = 'status-dot ' + (data.peer_online ? 'online' : '');
    if (current) chatHeadEl.textContent = peerById(current).login + (data.peer_online ? '' : ' (не в сети)');
  });

  socket.on('messages_read', () => {
    for (let key in store) {
      store[key].forEach(m => { if (m.sender_id === me.id) m.read = true; });
    }
    if (current) renderMessages();
  });

  socket.on('chat_cleared', () => {
    for (let key in store) delete store[key];
    messagesEl.innerHTML = '<div class="empty">История очищена.</div>';
    messagesEl.removeAttribute('data-chat');
    renderContacts();
    clearInputs();
  });
});

document.querySelectorAll('.tile').forEach(t => {
  t.onclick = () => { $('user').value = t.dataset.u; $('pass').value = t.dataset.p; $('err').textContent = ''; };
});

$('logout').onclick = () => { localStorage.clear(); location.reload(); };

$('clearBtn').onclick = () => {
  if (!confirm('Удалить ВСЮ переписку?')) return;
  if (socket) socket.emit('clear_chat');
};

/* ---------- РАБОТА С ВЛОЖЕНИЯМИ ---------- */
$('imgBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = function() {
  if (!this.files[0]) return;
  processImageFile(this.files[0]);
  this.value = ''; 
};

window.addEventListener('paste', (e) => {
    if (!current) return;
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let index in items) {
        const item = items[index];
        if (item.kind === 'file' && item.type.startsWith('image/')) {
            processImageFile(item.getAsFile());
            e.preventDefault(); 
            break;
        }
    }
});

function processImageFile(file) {
    if (file.size > 2 * 1024 * 1024) { alert('Картинка больше 2МБ!'); return; }
    const reader = new FileReader();
    reader.onload = function(e) { 
        attachImage = e.target.result;
        $('attachPreview').src = attachImage;
        $('attachBar').classList.remove('hidden');
        textEl.focus();
    };
    reader.readAsDataURL(file);
}

$('cancelAttach').onclick = () => { attachImage = null; $('attachBar').classList.add('hidden'); };

/* ---------- ОТВЕТЫ И ЛАЙТБОКС ---------- */
messagesEl.addEventListener('click', (e) => {
    const msgEl = e.target.closest('.msg');
    if (!msgEl) return;
    if (e.target.tagName === 'IMG' && e.target.classList.contains('full-img')) {
        $('lightboxImg').src = e.target.src;
        $('lightbox').classList.remove('hidden');
        return;
    }
    const msgId = +msgEl.getAttribute('data-id');
    const foundMsg = (store[current] || []).find(m => m.id === msgId);
    if (!foundMsg) return;

    replyContext = {
        id: foundMsg.id,
        sender_name: foundMsg.sender_id === me.id ? 'Вы' : peerById(foundMsg.sender_id).login,
        text: foundMsg.image ? '📷 Картинка' : foundMsg.body
    };
    $('replyName').textContent = replyContext.sender_name;
    $('replyPreview').textContent = replyContext.text;
    $('replyBar').classList.remove('hidden');
    textEl.focus();
});

$('lightbox').onclick = (e) => {
    if (e.target.id === 'lightbox' || e.target.id === 'lightboxClose') {
        $('lightbox').classList.add('hidden'); $('lightboxImg').src = '';
    }
};
$('cancelReply').onclick = () => { replyContext = null; $('replyBar').classList.add('hidden'); };

function clearInputs() {
    textEl.value = ''; replyContext = null; attachImage = null;
    $('replyBar').classList.add('hidden'); $('attachBar').classList.add('hidden');
}

/* ---------- ВВОД И ОТПРАВКА ---------- */
let typingTimer;
textEl.addEventListener('input', () => {
  if (!current || textEl.value.trim() === '') return;
  if (socket && !typingTimer) {
    socket.emit('typing');
    typingTimer = setTimeout(() => { typingTimer = null; }, 2000);
  }
});

$('composer').addEventListener('submit', e => {
  e.preventDefault();
  const bodyText = textEl.value.trim();
  if ((!bodyText && !attachImage) || !current || !socket) return;
  
  socket.emit('send_message', {
    to: current,
    body: bodyText,
    image: attachImage,
    reply_to: replyContext
  });
  
  clearInputs();
});

/* ---------- ПРИЁМ И РЕНДЕР ---------- */
function ingest(raw, silent) {
  const peer = raw.sender_id === me.id ? raw.recipient_id : raw.sender_id;
  const arr = store[peer] = store[peer] || [];
  if (arr.some(x => x.id === raw.id)) return false;

  if (raw.sender_id !== me.id && !silent) {
      playPing();
      if (document.hidden && Notification.permission === 'granted') {
        new Notification(peerById(raw.sender_id).login, { body: raw.image ? '📷 Картинка' : raw.body });
      }
  }

  arr.push(raw);
  if (!silent && (peer !== current || document.hidden)) unread[peer] = (unread[peer] || 0) + 1;
  if (peer === current && raw.sender_id !== me.id && !document.hidden && socket) socket.emit('mark_read');
  
  return true;
}

function peerById(id) {
  return peers.find(p => +p.id === +id) || { id, login: '—' };
}

function renderContacts() {
  contactsEl.innerHTML = '';
  for (const p of peers) {
    if (p.id === me.id) continue; 
    const list = store[p.id] || [];
    const last = list[list.length - 1];
    const el = document.createElement('div');
    el.className = 'contact' + (p.id === current ? ' active' : '');
    let preview = last ? (last.sender_id === me.id ? 'Вы: ' : '') + (last.image ? '📷 Картинка' : last.body) : 'Нет сообщений';
    
    el.innerHTML = `
      <div class="avatar">${esc(p.login[0])}</div>
      <div class="cinfo">
        <div class="cname">${esc(p.login)}</div>
        <div class="cprev">${esc(preview)}</div>
      </div>
      ${unread[p.id] ? '<div class="badge">' + unread[p.id] + '</div>' : ''}
    `;
    el.onclick = () => openChat(p.id);
    contactsEl.appendChild(el);
  }
}

function openChat(pid) {
  current = pid; unread[pid] = 0;
  chatHeadEl.textContent = peerById(pid).login;
  renderContacts(); renderMessages();
  if (socket) socket.emit('mark_read');
  textEl.focus();
}

function renderMessages() {
  if (!current) return;
  const list = (store[current] || []).slice().sort((a, b) => a.id - b.id);
  
  const currentChatId = messagesEl.getAttribute('data-chat');
  if (currentChatId !== String(current)) {
    messagesEl.innerHTML = ''; messagesEl.setAttribute('data-chat', current);
    setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 10);
  }

  if (!list.length) {
    if (!messagesEl.querySelector('.empty')) messagesEl.innerHTML = '<div class="empty">Пока пусто. Напиши первым.</div>';
    return;
  } else {
    const empty = messagesEl.querySelector('.empty'); if (empty) empty.remove();
  }

  const existingIds = new Set(); messagesEl.querySelectorAll('.msg').forEach(el => existingIds.add(el.getAttribute('data-id')));
  const isNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
  let forceScroll = false;

  for (const m of list) {
    if (!existingIds.has(String(m.id))) {
      const d = document.createElement('div');
      d.className = 'msg ' + (m.sender_id === me.id ? 'me' : 'them');
      d.setAttribute('data-id', m.id);
      
      let html = '';
      if (m.reply_to) html += `<div class="reply-block"><b>${esc(m.reply_to.sender_name)}</b><span>${esc(m.reply_to.text)}</span></div>`;
      if (m.image) html += `<img src="${m.image}" class="full-img" alt="img">`;
      if (m.body) html += `<div>${esc(m.body)}</div>`;

      let check = '';
      if (m.sender_id === me.id) {
          check = m.read ? '<span class="check read" title="Прочитано">✓✓</span>' : '<span class="check" title="Отправлено">✓</span>';
          forceScroll = true; 
      }
      html += `<time>${fmtTime(m.ts)}${check}</time>`;
      d.innerHTML = html;
      messagesEl.appendChild(d);
    } else {
      if (m.sender_id === me.id) {
        const el = messagesEl.querySelector(`.msg[data-id="${m.id}"] .check`);
        if (el && m.read && !el.classList.contains('read')) { el.classList.add('read'); el.textContent = '✓✓'; }
      }
    }
  }
  if (isNearBottom || forceScroll) messagesEl.scrollTop = messagesEl.scrollHeight;
}
</script>
</body>
</html>
